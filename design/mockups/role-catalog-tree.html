.nc .r:first-of-type{border-top:0}
.bdg{background:#16a34a;color:#fff;font-size:8.5px;font-weight:900;border-radius:3px;padding:3px 5px;letter-spacing:.2px}
.g{width:22px;height:16px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#fff;background:#5b21b6}
.def .g.m,.def .g.d{background:#16a34a}
.g.x{background:#efefef;color:#444}
.rel{background:#f4f4f4;border-radius:8px;margin-top:14px;padding:10px 10px;font-size:11px}
.rl{display:flex;align-items:center;gap:5px;color:#555;font-weight:700;font-size:11px;margin-right:12px}
.pill{height:22px;border-radius:11px;padding:0 9px;display:inline-flex;align-items:center;font-size:11px;background:#dbe5f7;color:#3b6ab5;white-space:nowrap}

const CL='<svg width="30" height="20" viewBox="0 0 30 20"><defs><clipPath id="r"><rect width="30" height="20" rx="3"/></clipPath></defs><g clip-path="url(#r)"><rect width="30" height="20" fill="#fff"/><rect y="10" width="30" height="10" fill="#d52b1e"/><rect width="11" height="10" fill="#0039a6"/><path d="M5.5 2.2l.9 2.6h2.7l-2.2 1.6.8 2.6-2.2-1.6-2.2 1.6.8-2.6-2.2-1.6h2.7z" fill="#fff"/></g><rect x=".5" y=".5" width="29" height="19" rx="2.5" fill="none" stroke="rgba(0,0,0,.15)"/></svg>';

const fl=(k,w)=>(k==='en'?UK:CL).replace('width="30" height="20"',`width="${w}" height="${Math.round(w*2/3)}"`);
const chipsHTML=a=>{const rows=[[]];for(const c of a){if(c==='/')rows.push([]);else rows[rows.length-1].push(c)}return '<div class="chips">'+rows.map(r=>'<div class="crow">'+r.map(c=>`<div class="chip">${fl(c[0],22)}${c[1]}</div>`).join('')+'</div>').join('')+'</div>'};

function node(x,y,h,col,name,code,fam,chips,w){const d=document.createElement('div');d.className='node';d.style.cssText=`left:${x-58}px;top:${y-310}px;height:${h}px;background:${col};${w?'width:'+w+'px':''}`;

document.getElementById('gEN').innerHTML=`<div class="glbl">${fl('en',18)}EN</div>`+card('General Manager',[['–','General Manager']],1)+card('CEO',[['–','CEO']])+card('Managing Director',[['–','Managing Director']]);
document.getElementById('gES').innerHTML=`<div class="glbl">${fl('cl',18)}ES-CL</div>`+card('Gerente General',[['M','Gerente General'],['X','Gerente / Gerenta General'],['F','Gerenta General']],1)+card('Director Ejecutivo',[['M','Director Ejecutivo'],['X','Director/a Ejecutivo/a'],['F','Directora Ejecutiva']]);
document.querySelectorAll('.g').forEach(g=>{if(g.textContent==='–'){g.textContent='—'}});

ev.innerHTML=`<span class="rl" style="height:22px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><path d="M12 4v16M5 13l7 7 7-7"/></svg>${T.evl}</span>`+T.ev.map(s=>`<span class="pill">${s}</span>`).join('');
