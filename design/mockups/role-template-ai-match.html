<style>
:root{--teal:#00b9c6;--txt:#495057;--muted:#6c757d;--dark:#343a40;--line:#dfe7ef}

*{box-sizing:border-box}
.abs{position:absolute}
svg{display:inline-block;vertical-align:middle}

.th{position:absolute;top:9px;font-weight:700;font-size:14px;color:var(--dark);display:flex;align-items:center;gap:8px}

.circ{left:11px;top:65px;width:48px;height:48px;border-radius:50%;border:2px solid #7ff0f8;box-shadow:0 0 0 1px #c9f7fb inset;background:#f6f6fe;display:flex;align-items:center;justify-content:center}
.rname{left:69px;top:58px;font-size:14.5px;color:#ba2126;display:flex;align-items:center;gap:7px}

.g{background:#22c55e}.r{background:#ef4444}

.expin{left:15px;top:138px;width:1446px;height:872px;background:#fafafa;border-left:1px solid var(--line);border-right:1px solid var(--line);border-top:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:7px;background:#eeeeee;border-radius:10px;padding:2px 8px 2px 7px;font-size:10px;letter-spacing:.2px;color:var(--muted);text-transform:uppercase}

.tags{left:32px;top:315px;display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.tteal{background:var(--teal);color:#fff;border-radius:10px;padding:3px 11px;font-size:10px;font-weight:700;letter-spacing:.2px}
.tsav{background:var(--teal);color:#fff;border-radius:4px;padding:3px 5px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:3px;margin-right:2px}

.opt .code{font-size:11.5px;color:var(--muted);margin-left:4px}

.rp{position:absolute;left:15px;right:14px}

.small{font-size:11.5px;color:var(--muted)}
.ddesc{font-size:11.5px;color:var(--txt);line-height:18px}
.chips{display:flex;flex-wrap:wrap;gap:5px 4px;width:700px}
.chip{background:#3b82f6;color:#fff;font-weight:700;font-size:11px;letter-spacing:-.25px;padding:0 6px;height:22px;line-height:22px;border-radius:5px}
.chip.gr{background:#22c55e}
.laws{font-size:11.5px;line-height:17.5px;color:var(--txt)}
.laws .i{color:var(--muted)}
