<!-- eleva 360°: paste into <head> on every page. Paths assume the brand-assets folder is
     served at /brand/ (for example public/brand/ in Next.js or Vite). Change /brand/ if not. -->

<!-- Brand fonts: Lexend (headings, labels, numbers) and Atkinson Hyperlegible (text) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@500;600&display=swap">

<!-- Brand tokens: colours, type scale, radii, spacing (light and dark) -->
<link rel="stylesheet" href="/brand/web/eleva-tokens.css">

<!-- Favicon and app icons -->
<link rel="icon" href="/brand/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/brand/icons/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/brand/icons/icon-180.png">
<link rel="manifest" href="/brand/web/site.webmanifest">
<meta name="theme-color" content="#0b3a5c">
